name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} · native + Harness browser L2
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      # Browser-only L2 against an independently installed Harness. Not Tauri L3.
      CI: 'true'
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/playwright
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Verify the exact upstream source
        run: test "$(git -C source/dsh-ops rev-parse HEAD)" = 6e133320b4f7a81c289e05ff6afddc740cdef36e
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.10.0
          cache: pnpm
      - name: Install the Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal && rustup default 1.98.1
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Select the MSVC linker instead of Git Bash link.exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $linker = Join-Path $env:VCToolsInstallDir 'bin/Hostx64/x64/link.exe'
          if (!(Test-Path -LiteralPath $linker)) { throw "MSVC linker missing: $linker" }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" >> $env:GITHUB_ENV
      - name: Record the actual runner target
        run: node -p 'JSON.stringify({platform:process.platform,arch:process.arch,node:process.version})' && rustc -vV
      - name: Install locked development dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Lint
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: Unit tests
        run: pnpm run test -- --run
      - name: Build JavaScript, Rust worker, FastCtx and platform runtime assets
        # The tsdown hook owns all required native/assets builds; no user provisioning.
        run: pnpm run build
      - name: Native Rust regression tests
        run: cargo test --locked --manifest-path native/Cargo.toml --target-dir .cache/runtime/worker-target
      - name: Install Chromium and its system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Real isolated Harness host and Playwright browser L2
        # Installs @deepseek-ai/dsh@0.2.1-alpha.1 in mkdtemp; no existing DSH fallback.
        # Real default tools, background jobs, PTC, native I/O and confined Bash; no stubs.
        run: pnpm run test:e2e
      - name: Package the tested native target without rebuilding it away
        run: pnpm --config.ignore-scripts=true pack
      - name: Upload the built platform package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}
          path: dsh-ops-next-*.tgz
          if-no-files-found: error
          retention-days: 7
      - name: Upload browser traces and real host logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-l2-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/e2e/
          if-no-files-found: ignore
          retention-days: 7
