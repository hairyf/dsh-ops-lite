name: Release

on:
  push:
    tags: [v*]

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  publish:
    needs: validate
    name: Publish the validated platform packages, then the main package
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.10.0
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-package*'
          merge-multiple: true
          path: npm-packages
      - name: Verify exact versions and refuse any already-published version before publishing
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { execFileSync } from 'node:child_process'
          import { readFileSync } from 'node:fs'
          const root = JSON.parse(readFileSync('package.json', 'utf8'))
          assert.equal(process.env.RELEASE_TAG, `v${root.version}`)
          const names = ['@dshopslite/win32-x64', '@dshopslite/linux-x64', '@dshopslite/darwin-arm64', 'dsh-ops-lite']
          for (const name of names) {
            const file = `npm-packages/${name.replace(/^@/, '').replace('/', '-')}-${root.version}.tgz`
            const packed = JSON.parse(execFileSync('tar', ['-xOf', file, 'package/package.json'], { encoding: 'utf8' }))
            assert.equal(packed.name, name)
            assert.equal(packed.version, root.version)
            const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}/${root.version}`, { signal: AbortSignal.timeout(30000) })
            assert.equal(response.status, 404, `Refuse to overwrite ${name}@${root.version}, or publish when registry availability is unknown (HTTP ${response.status}).`)
          }
          NODE
      - name: Publish the exact tested tarballs with npm trusted publishing or the existing registry token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          for NAME in @dshopslite/win32-x64 @dshopslite/linux-x64 @dshopslite/darwin-arm64 dsh-ops-lite; do
            FILE="${NAME#@}"
            FILE="${FILE/\//-}"
            npm publish "npm-packages/$FILE-$VERSION.tgz" --provenance --access public --ignore-scripts
          done
